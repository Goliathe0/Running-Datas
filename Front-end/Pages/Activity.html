<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Activité</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <!-- Charger Chart.js depuis un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <nav>
      <button class="btn-mainMenu">Main menu</button>
      <button class="btn-activities">Activités</button>
      <button class="btn-records">Mur des records</button>
      <button class="btn-stats">Statistiques avancées</button>
    </nav>
    <header></header>

    <div class="tabs">
      <button class="tab-button" onclick="openTab(event, 'Running')">
        Course à pied
      </button>
      <button class="tab-button" onclick="openTab(event, 'Cycling')">
        Cyclisme
      </button>
      <button class="tab-button" onclick="openTab(event, 'Swimming')">
        Natation
      </button>
    </div>
    <table id="laps-table">
      <thead>
        <tr>
          <th>distance (m)</th>
          <th>temps</th>
          <th>allure/vitesse (m/s / km/h)</th>
          <th>Dénivelé (m)</th>
          <th>BPM (moy / max)</th>
          <th>Dénivelé posititif</th>
          <th>Dénivelé négatif</th>
        </tr>
      </thead>
      <tbody>
        <!-- Le JavaScript remplira ici -->
      </tbody>
    </table>

    <div id="map-container">
      <div id="map"></div>
    </div>
    <canvas id="monAltitude" width="400" height="200"></canvas>
    <canvas id="maVitesse" width="400" height="200"></canvas>
    <div class="chart-controls">
      <button class="chart-button" onclick="toggleDataset('maVitesse', 2)">
        Altitude
      </button>
      <button class="chart-button" onclick="toggleDataset('maVitesse', 1)">
        Allure/Vitesse
      </button>
      <button class="chart-button" onclick="openTab(event, 'Running')">
        Allure moyenne du circuit
      </button>

      <button class="chart-button" onclick="toggleDataset('vitesseChart', 0)">
        Fréquence cardiaque
      </button>
      <button class="chart-button" onclick="openTab(event, 'Swimming')">
        Puissance
      </button>
      <button class="chart-button" onclick="openTab(event, 'Running')">
        Cadence
      </button>
      <button class="chart-button" onclick="openTab(event, 'Running')">
        longueur foulée
      </button>
      <button class="chart-button" onclick="openTab(event, 'Running')">
        oscillation verticale
      </button>
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <!-- Tes autres scripts (si nécessaire) -->
    <script src="../src/utils/format.js"></script>
    <script src="../src/utils/fillcharts.js"></script>
    <script src="../src/utils/fillText.js"></script>
    <script src="../src/pages/Activity.js"></script>
    <script src="../src/utils/boutons.js"></script>
    <script src="../src/utils/map.js"></script>
    <script></script>
  </body>
</html>
