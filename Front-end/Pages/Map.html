<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <title>Map</title>
    <link rel="stylesheet" href="style.css" />
    <link
      rel="stylesheet"
      href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css"
    />
    <!-- Charger Chart.js depuis un CDN -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  </head>
  <body>
    <div id="sidebar">
      <h2>Activités</h2>
      <button id="toggle-all">Tout sélectionner/déselectionner</button>
      <div id="activity-list"></div>
    </div>
    <div id="map-container" class="layout-fullmap">
      <div id="map"></div>
    </div>
    <div
      id="coords"
      style="
        position: absolute;
        bottom: 10px;
        left: 10px;
        background: rgba(255, 255, 255, 0.8);
        padding: 5px 10px;
        border-radius: 4px;
        font-size: 14px;
        z-index: 1000;
      "
    >
      Lat : — | Lon : —
    </div>

    <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>

    <script src="../src/pages/Map.js"></script>
    <script src="../src/utils/fillMap.js"></script>
    <script></script>
  </body>
</html>
